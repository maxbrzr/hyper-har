[project]
name = "baya-har"
version = "1.0.0"
description = "Experiments for BayaHAR"
readme = "README.md"
authors = [
    { name = "maxbrzr", email = "maximilian.burzer@kit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "whar-datasets",
]

[project.scripts]
baya-har = "baya_har.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
whar-datasets = { git = "https://github.com/teco-kit/whar-datasets.git" }
